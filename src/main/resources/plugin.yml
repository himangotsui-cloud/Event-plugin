name: EventArena
version: '1.0.0'
main: com.eventarena.plugin.EventArenaPlugin
api-version: '1.21'
author: EventArena
description: PvP event / arena plugin with Crystal, Mace, Sword and Axe modes.

commands:
  event:
    description: Main event command
    usage: /event [make|announce|join|leave|start|stop|status|border|drop|revive]
    permission: event.use

permissions:
  event.admin:
    description: Full administrative access to the event plugin
    default: op
    children:
      event.border: true
      event.drop: true
      event.revive: true
      event.announce: true
      event.make: true
  event.use:
    description: Basic event commands (join/leave/status)
    default: true
  event.make:
    description: Create/configure events
    default: op
  event.border:
    description: Change the event border
    default: op
  event.drop:
    description: Clear the arena
    default: op
  event.revive:
    description: Revive players
    default: op
  event.announce:
    description: Send event announcements
    default: op
